[workspace.package]
version = "3.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.74"
repository = "https://github.com/BPplays/tzlookup"

[package]
name = "tzlookup"

# deprecated
# see: https://doc.rust-lang.org/cargo/reference/manifest.html#the-authors-field
# authors = ["Chris Down <chris@chrisdown.name>"]

description = "Set the system timezone based on IP geolocation."
readme = "README.md"
keywords = ["timezone", "localtime", "geolocation"]
categories = ["command-line-utilities", "date-and-time"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[workspace]
members = ["cli"]
default-members = ["cli"]
resolver = "2"

[features]
default = []

systemd = [
	"dep:zbus",
	"dep:zbus_systemd",
]


full = [
	"systemd",
]

[dependencies]
log = "0.4"
serde_json = { version = "1.0", default-features = false }
tempfile = "3.21"
ureq = { version = "3.1", default-features = false, features = ["json", "rustls"] }
thiserror = "2.0"
tz-rs = "0.7"
strum = { version = "0.28", features = ["derive"] }



# optional
zbus_systemd = { version = "0.26000", default-features = false, features = ["timedate1"], optional = true }
zbus = { version = "5.14", default-features = false, features = ["tokio"], optional = true }
