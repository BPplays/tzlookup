[package]
name = "tzlookup-cli"

description = "Set the system timezone based on IP geolocation."
readme = "README.md"

version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "tzlookup"
path = "src/main.rs"

[dependencies]
tzlookup = { version = "3.2", path = "..", features = ["systemd"] }

clap = { version = "4.5", default-features = false, features = ["std", "derive", "help"] }
tokio = { version = "1.54", features = ["full"] }
anyhow = "1.0"
env_logger = { version = "0.11", features = ["humantime"], default-features = false }
log = "0.4"
strum = { version = "0.28", features = ["derive"] }
